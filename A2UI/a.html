<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Form</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div id="booking-form" class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
        <h2 class="text-2xl font-bold mb-6 text-gray-800">Complete Your Booking</h2>
        
        <form id="submitBooking">
            <div class="mb-4">
                <label for="date" class="block text-sm font-medium text-gray-700 mb-1">Select Date</label>
                <input type="date" id="date" name="/booking/date" 
                       class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div class="mb-6">
                <label for="people" class="block text-sm font-medium text-gray-700 mb-1">Number of People</label>
                <select id="people" name="/booking/people" 
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                </select>
            </div>

            <button type="submit" 
                    class="w-full bg-blue-600 text-white font-semibold py-2 px-4 rounded-md hover:bg-blue-700 transition duration-200">
                Book Now
            </button>
        </form>
    </div>

    <script>
        // Simple handler for the 'submitBooking' action defined in JSON
        document.getElementById('submitBooking').addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            const data = Object.fromEntries(formData.entries());
            
            console.log("Action: submitBooking", data);
            alert("Booking submitted for " + data['/booking/people'] + " person(s) on " + data['/booking/date']);
        });
    </script>
</body>
</html>
