<!DOCTYPE html>
<html>

<head>
  <style>
    :root {
      --chatgpt-green: #10a37f;
      --card-bg: #ffffff;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f7f7f8;
      /* Light gray background to make card pop */
    }

    .card {
      background: var(--card-bg);
      color: #333;
      padding: 24px;
      border-radius: 16px;
      text-align: left;
      width: 85%;
      max-width: 400px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      /* Soft shadow for object feel */
      border: 1px solid rgba(0, 0, 0, 0.05);
      position: relative;
      overflow: hidden;
    }

    .card-header {
      display: flex;
      align-items: center;
      margin-bottom: 16px;
    }

    .status-badge {
      background: #e7f5f1;
      color: var(--chatgpt-green);
      font-size: 10px;
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    h1 {
      font-size: 22px;
      margin: 0;
      color: #1a1a1a;
      line-height: 1.2;
    }

    p {
      color: #666;
      font-size: 14px;
      margin: 8px 0 0 0;
      line-height: 1.5;
    }

    .accent-bar {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: var(--chatgpt-green);
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="accent-bar"></div>
    <div class="card-header">
      <span class="status-badge">Live MCP Session</span>
    </div>
    <h1 id="title">Initializing...</h1>
    <p id="description">Waiting for data from ChatGPT...</p>
  </div>

  <script type="module">
    const titleEl = document.querySelector("#title");
    const descEl = document.querySelector("#description");

    const render = (data) => {
      if (!data) {
        return;
      }
      
      // Use message if available, otherwise fallback to name, otherwise default
      titleEl.textContent = data.message || "Hello, User!";
      descEl.textContent = "Your MCP UI-app is now connected and active.";
    };

    // Event listener for ChatGPT injection
    window.addEventListener("openai:set_globals", () => {
      console.log("Global data updated:", window.openai.toolOutput);
      render(window.openai.toolOutput);
    });

  </script>
</body>

</html>
